name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          unzip -q CineSharkaoApp.zip
          cp "Cine Sharkao Script.txt" CineSharkaoApp/app/src/main/assets/cine_sharkao.user.js
          curl -L -o CineSharkaoApp/app/src/main/assets/hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js
          cd CineSharkaoApp && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CineSharkao-apk
          path: CineSharkaoApp/app/build/outputs/apk/debug/app-debug.apk
